# Docker Compose Production Deployment Configuration (AOP-002 & AOP-005)

services:
  smriti-db-prod:
    image: postgres:15-alpine
    container_name: smriti-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smritidb}
      POSTGRES_USER: ${POSTGRES_USER:-smritiuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_prod_password}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smritiuser} -d ${POSTGRES_DB:-smritidb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  smriti-redis-prod:
    image: redis:7-alpine
    container_name: smriti-redis-prod
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  smriti-api-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smriti-api-prod
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smritiuser}:${POSTGRES_PASSWORD:-secure_prod_password}@smriti-db-prod:5432/${POSTGRES_DB:-smritidb}
      REDIS_HOST: smriti-redis-prod
      REDIS_PORT: 6379
      ENVIRONMENT: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGE_ME_FOR_DEVELOPMENT_ONLY_JWT}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-CHANGE_ME_FOR_DEVELOPMENT_ONLY_INTERNAL}
      SGIP_VAULT_MASTER_KEY: ${SGIP_VAULT_MASTER_KEY:-CHANGE_ME_FOR_DEVELOPMENT_ONLY_VAULT}
    volumes:
      - ./.env:/app/.env:ro
      - ./backend:/app
      - ./CHANGELOG.md:/app/CHANGELOG.md
    depends_on:
      smriti-db-prod:
        condition: service_healthy
      smriti-redis-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 15s
      timeout: 5s
      retries: 3

  smriti-worker-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smriti-worker-prod
    entrypoint: ["./worker_entrypoint.sh"]
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smritiuser}:${POSTGRES_PASSWORD:-secure_prod_password}@smriti-db-prod:5432/${POSTGRES_DB:-smritidb}
      REDIS_HOST: smriti-redis-prod
      REDIS_PORT: 6379
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-CHANGE_ME_FOR_DEVELOPMENT_ONLY_INTERNAL}
    volumes:
      - ./backend:/app
    depends_on:
      smriti-db-prod:
        condition: service_healthy
      smriti-redis-prod:
        condition: service_healthy
      smriti-api-prod:
        condition: service_healthy

  smriti-workspace-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smriti-workspace-prod
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      VITE_API_URL: http://localhost:8000
      SMRITI_API_HOST: smriti-api-prod:8000
      REDIS_HOST: smriti-redis-prod
    depends_on:
      - smriti-api-prod

  smriti-nginx-prod:
    image: nginx:alpine
    container_name: smriti-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs_data:/etc/letsencrypt
    depends_on:
      - smriti-workspace-prod
      - smriti-api-prod

volumes:
  postgres_prod_data:
  redis_prod_data:
  certs_data:
