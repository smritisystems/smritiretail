name: Release Manager

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v3.16.0)"
        required: true
        type: string
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      deploy:
        description: "Deploy to production after release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  set_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      release_type: ${{ steps.set.outputs.release_type }}
    steps:
      - name: Determine version
        id: set
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${{ github.ref_name }}"
            release_type="patch"
          else
            version="${{ inputs.version }}"
            release_type="${{ inputs.release_type }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"

  verify:
    needs: set_version
    uses: ./.github/workflows/verify.yml
    with:
      release_version: ${{ needs.set_version.outputs.version }}
      release_type: ${{ needs.set_version.outputs.release_type }}

  security:
    needs: verify
    uses: ./.github/workflows/security-gate.yml
    with:
      release_version: ${{ needs.set_version.outputs.version }}
    secrets: inherit

  quality:
    needs: security
    uses: ./.github/workflows/quality-gate.yml
    with:
      release_version: ${{ needs.set_version.outputs.version }}

  build:
    needs: quality
    uses: ./.github/workflows/build.yml
    with:
      release_version: ${{ needs.set_version.outputs.version }}
    secrets: inherit

  image_scan:
    needs: build
    uses: ./.github/workflows/image-scan.yml
    with:
      release_version: ${{ needs.set_version.outputs.version }}
    secrets: inherit

  publish:
    needs: image_scan
    uses: ./.github/workflows/publish.yml
    with:
      release_version: ${{ needs.set_version.outputs.version }}
    secrets: inherit

  package:
    needs: publish
    uses: ./.github/workflows/package.yml
    with:
      release_version: ${{ needs.set_version.outputs.version }}
      release_type: ${{ needs.set_version.outputs.release_type }}

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.set_version.outputs.version }}
          name: Release ${{ needs.set_version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: release
    if: ${{ inputs.deploy == true }}
    uses: ./.github/workflows/deploy-production.yml
    with:
      release_version: ${{ needs.set_version.outputs.version }}
    secrets: inherit
