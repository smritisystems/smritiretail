name: Verify

"on":
  workflow_call:
    inputs:
      release_version:
        description: 'Release version'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: false
        type: string
        default: patch

jobs:
  frontend-verify:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend production bundle
        run: npm run build

  backend-verify:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smriti_retail_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smriti_retail_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/dev.txt

      - name: Run backend database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/smriti_retail_db
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/smriti_retail_db
          JWT_SECRET_KEY: ci_test_secret_do_not_use_in_prod
          SGIP_VAULT_MASTER_KEY: ci_vault_master_key_do_not_use_in_prod
          INTERNAL_SERVICE_KEY: ci_internal_service_key_do_not_use_in_prod
        run: pytest -v
