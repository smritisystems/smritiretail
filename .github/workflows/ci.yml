name: SMRITI CI — v2

on:
  push:
    branches: [main, smritiNX, developer, "release/*", "hotfix/*"]
  pull_request:
    branches: [main, smritiNX, developer]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# Job 1: Frontend CI
# ============================================================
jobs:
  frontend-ci:
    name: Frontend (TypeScript Gate + Vitest + Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Type Check (Hard Gate — 0 errors required)
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Vitest Unit Tests
        run: npx vitest run --reporter=verbose

      - name: Production Build Sanity Check
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

# ============================================================
# Job 2: Backend CI
# ============================================================
  backend-ci:
    name: Backend (pytest + ruff + Alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: smritisys
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smritisys"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/smritisys"
      JWT_SECRET_KEY: "ci-test-secret-key-minimum-32-chars-ok"
      INTERNAL_SERVICE_KEY: "ci-test-internal-svc-key-min-32chars"
      SGIP_VAULT_MASTER_KEY: "ci-test-vault-master-key-32-chars-k"
      ENVIRONMENT: "test"
      TESTING: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f dev.txt ]; then pip install -r dev.txt; fi

      - name: Ruff Linting
        run: |
          pip install ruff
          ruff check app/ --select=E,W,F --ignore=E501

      - name: Run Alembic Migrations (smritisys control plane)
        run: alembic -x target=control -x db=smritisys upgrade head
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/smritisys"

      - name: Create smriti001 Company Database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE smriti001;" || true

      - name: Run Alembic Migrations (smriti001 company plane)
        run: alembic -x target=tenant -x db=smriti001 upgrade head
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/smriti001"

      - name: Run Naming Guard (NGP-v1.0)
        run: python ../scripts/smriti_naming_guard.py --root ..
        continue-on-error: true

      - name: Tenant Data Boundary CI Guard (TDB-v1.0)
        # Enforces the TENANT DATA BOUNDARY permanently:
        # smritisys = Control Plane ONLY. No tenant-operational data.
        # Fails if seed scripts default to smritisys, tenant loops include smritisys,
        # or CI alembic commands are missing -x target= flags.
        run: python ../scripts/ci_tenant_boundary_guard.py --root ..

      - name: CFOC Migration-Time Column Guard (CFOC-v3.46.0)
        # Enforces Change-Time CFOC: Every column in Alembic migrations
        # must carry canonical field registration or declarative classification.
        run: python ../scripts/ci_migration_cfoc_guard.py

      - name: CFOC API DTO Reconciliation Guard (CFOC-v3.46.0 Pillar 4)
        # Verifies Pydantic request/response models have parity with the canonical
        # field registry. Ungoverned business fields in DTOs fail the governance gate.
        run: python ../scripts/ci_api_dto_reconciliation.py

      - name: CFOC UX Field Governance & Zero-Drift Guard (CFOC-v1.0)
        # Enforces the CANONICAL FIELD OWNERSHIP CONTRACT permanently:
        # Zero duplicate field IDs, zero broken DB mappings, zero generated TS drift,
        # and zero unauthorized hardcoded business metadata.
        run: python ../scripts/ci_ux_field_governance_guard.py

      - name: Run Backend Tests
        run: >
          pytest tests/ app/tests/ app/compliance/tests/
          -v --tb=short --timeout=120 -x
        # Includes all unit, compliance, and stock movement ledger tests (self-provisioned)

# ============================================================
# Job 3: Security Scan
# ============================================================
  security-scan:
    name: Security (Gitleaks + bandit + pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bandit Security Scan (Backend)
        run: |
          pip install bandit
          bandit -r backend/app/ -ll \
            -x backend/app/compliance/tests/,backend/app/tests/ \
            --skip B101,B311
        # B101=assert statements, B311=random for IDs (not crypto)

      - name: pip-audit (Dependency Vulnerabilities)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
        continue-on-error: true
        # Advisory only — hard-fail on CRITICAL planned for v4 milestone

# ============================================================
# Job 4: Docker Build Validation (main branch only)
# ============================================================
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: smriti-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: smriti-web:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
