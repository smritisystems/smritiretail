name: SMRITI CI

on:
  push:
    branches: [ main, smritiNX, developer ]
  pull_request:
    branches: [ main, smritiNX, developer ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: smritisys
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run SMRITI Naming Guard (NGP-v1.0)
        run: python scripts/smriti_naming_guard.py --root .

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Strict TypeScript Verification
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        run: npx vitest run

      - name: Run Production Bundle Build
        run: npm run build

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f backend/dev.txt ]; then pip install -r backend/dev.txt; fi

      - name: Create Company Business Database (smriti001)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE smriti001;"

      - name: Run Alembic Control Plane Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/smritisys
        run: alembic upgrade head

      - name: Run Alembic Company Business Database Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/smriti001
        run: alembic upgrade head

      - name: Run Read-Only Schema Drift Audit
        run: python scripts/audit_sqlalchemy_schema_drift.py smriti001 smritisys

      - name: Run Python Backend Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/smritisys
          JWT_SECRET_KEY: ci_test_secret_do_not_use_in_prod
          SGIP_VAULT_MASTER_KEY: ci_vault_master_key_do_not_use_in_prod
        run: pytest -v
