name: SMRITI CI — v2

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# Job 1: Frontend CI
# ============================================================
jobs:
  frontend-ci:
    name: Frontend (TypeScript Gate + Vitest + Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Registry usage validation
        run: npm run validate-registry

      - name: Launchpad coverage validation
        run: npm run validate-launchpad

      - name: JavaScript dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: TypeScript Type Check (Hard Gate — 0 errors required)
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Vitest Unit Tests
        run: npx vitest run --reporter=verbose

      - name: Production Build Sanity Check
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

# ============================================================
# Job 2: Backend CI
# ============================================================
  backend-ci:
    name: Backend (pytest + ruff + Alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: smritisys
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smritisys"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/smritisys"
      POSTGRES_PORT: "5432"
      JWT_SECRET_KEY: "ci-test-secret-key-minimum-32-chars-ok"
      INTERNAL_SERVICE_KEY: "ci-test-internal-svc-key-min-32chars"
      SGIP_VAULT_MASTER_KEY: "ci-test-vault-master-key-32-chars-k"
      SMRITI_TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/smritisys"
      ENVIRONMENT: "test"
      TESTING: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout
          if [ -f dev.txt ]; then pip install -r dev.txt; fi

      - name: Install Ruff
        run: pip install ruff

      - name: Repository Ruff baseline (non-blocking legacy findings)
        run: ruff check app/ --select=E,W,F --ignore=E501 --statistics
        continue-on-error: true

      - name: Ruff changed backend files
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ -n "$PR_HEAD_SHA" ]]; then
            HEAD_SHA="$PR_HEAD_SHA"
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          else
            HEAD_SHA="$GITHUB_SHA"
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          fi
          mapfile -t FILES < <(
            git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_SHA" "$HEAD_SHA" -- backend/app |
              awk '/^backend\/app\/.*\.py$/ { sub(/^backend\//, ""); print }'
          )
          if ((${#FILES[@]})); then
            RUFF_REPORT="$RUNNER_TEMP/ruff-changed.json"
            ruff check "${FILES[@]}" --select=E,W,F --ignore=E501 --output-format=json > "$RUFF_REPORT" || true
            python "$GITHUB_WORKSPACE/.github/scripts/check_changed_python_lines.py" \
              "$BASE_SHA" "$HEAD_SHA" ruff "$RUFF_REPORT"
          else
            echo "No changed backend Python files to lint."
          fi

      - name: Run Alembic Migrations (smritisys control plane)
        run: alembic -x target=control -x db=smritisys upgrade control@head
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/smritisys"

      - name: Create isolated company test databases
        run: |
          for db in smriti_test_001 smriti_test_002; do
            exists=$(PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'")
            if [[ "$exists" != "1" ]]; then
              PGPASSWORD=postgres createdb -h localhost -U postgres "$db"
            fi
          done

      - name: Reject edits to shipped Alembic revisions
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          python ../scripts/check_immutable_migrations.py "$BASE_SHA" "$GITHUB_SHA"

      - name: Run Alembic Migrations (smriti_test_001 company plane)
        run: alembic -x target=tenant -x db=smriti_test_001 upgrade tenant@head
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/smriti_test_001"

      - name: Run Alembic Migrations (smriti_test_002 company plane)
        run: alembic -x target=tenant -x db=smriti_test_002 upgrade tenant@head
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/smriti_test_002"

      - name: Run Naming Guard (NGP-v1.0)
        run: python ../scripts/smriti_naming_guard.py --root ..
        continue-on-error: true

      - name: Tenant Data Boundary CI Guard (TDB-v1.0)
        # Enforces the TENANT DATA BOUNDARY permanently:
        # smritisys = Control Plane ONLY. No tenant-operational data.
        # Fails if seed scripts default to smritisys, tenant loops include smritisys,
        # or CI alembic commands are missing -x target= flags.
        run: python ../scripts/ci_tenant_boundary_guard.py --root ..

      - name: CFOC Migration-Time Column Guard (CFOC-v3.46.0)
        # Enforces Change-Time CFOC: Every column in Alembic migrations
        # must carry canonical field registration or declarative classification.
        run: python ../scripts/ci_migration_cfoc_guard.py
      - name: UMGP Migration Governance Gate (UMGP-v1.0)
        # Enforces Upgrade & Migration Governance Policy:
        # G1: Every migration >= v1553 must declare @migration_target
        # G2: Destructive ops in new migrations need # UMGP:DESTRUCTIVE_APPROVED
        # G3: No hardcoded tenant DB names (warnings, not failures)
        run: python ../scripts/check_migration_governance.py

      - name: CFOC API DTO Reconciliation Guard (CFOC-v3.46.0 Pillar 4)
        # Verifies Pydantic request/response models have parity with the canonical
        # field registry. Ungoverned business fields in DTOs fail the governance gate.
        run: python ../scripts/ci_api_dto_reconciliation.py

      - name: CFOC UX Field Governance & Zero-Drift Guard (CFOC-v1.0)
        # Enforces the CANONICAL FIELD OWNERSHIP CONTRACT permanently:
        # Zero duplicate field IDs, zero broken DB mappings, zero generated TS drift,
        # and zero unauthorized hardcoded business metadata.
        run: python ../scripts/ci_ux_field_governance_guard.py
        env:
          POSTGRES_PORT: "5432"
          SMRITI_TENANT_DATABASES: "smriti_test_001,smriti_test_002"

      - name: Install Playwright Chromium for Backend PDF Tests
        run: playwright install chromium

      - name: Run Backend Tests
        run: >
          pytest tests/ app/tests/ app/compliance/tests/
          -v --tb=short --timeout=120 --maxfail=20
        # Includes all unit, compliance, and stock movement ledger tests (self-provisioned)

      - name: Run Retail Transaction Lifecycle E2E Suite (Cross-Workspace Parity)
        # Executes the full retail transactional lifecycle: Article Creation -> PO -> GRN -> POS Sale -> Stock Ledger
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 1981 &
          UVICORN_PID=$!
          echo "Waiting for FastAPI backend daemon on port 1981..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:1981/version >/dev/null 2>&1 || curl -s http://127.0.0.1:1981/ >/dev/null 2>&1; then
              echo "FastAPI backend is ready!"
              break
            fi
            sleep 1
          done
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/smriti_test_001" \
          BACKEND_API_URL="http://127.0.0.1:1981" \
          FRONTEND_BASE_URL="http://localhost:3000" \
          python ../scripts/test_retail_lifecycle_e2e.py
          kill $UVICORN_PID || true

      - name: Upload Visual Parity Telemetry Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-visual-parity-telemetry
          path: scratch/visual-audit-temp/e2e_parity/
          if-no-files-found: ignore

# ============================================================
# Job 3: Security Scan
# ============================================================
  security-scan:
    name: Security (Gitleaks + bandit + pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bandit repository baseline (non-blocking legacy findings)
        run: |
          pip install bandit
          bandit -r backend/app/ -ll \
            -x backend/app/compliance/tests/,backend/app/tests/ \
            --skip B101,B311
        continue-on-error: true
        # B101=assert statements, B311=random for IDs (not crypto)

      - name: Bandit changed backend code
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ -n "$PR_HEAD_SHA" ]]; then
            HEAD_SHA="$PR_HEAD_SHA"
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          else
            HEAD_SHA="$GITHUB_SHA"
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          fi
          mapfile -t FILES < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- backend/app |
              grep -E '^backend/app/.*\.py$' |
              grep -Ev '^backend/app/(tests|compliance/tests)/'
          )
          if ((${#FILES[@]})); then
            BANDIT_REPORT="$RUNNER_TEMP/bandit-changed.json"
            bandit "${FILES[@]}" -ll --skip B101,B311 --format json > "$BANDIT_REPORT" || true
            python "$GITHUB_WORKSPACE/.github/scripts/check_changed_python_lines.py" \
              "$BASE_SHA" "$HEAD_SHA" bandit "$BANDIT_REPORT"
          else
            echo "No changed backend application files to scan."
          fi

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-results.sarif

      - name: pip-audit (Dependency Vulnerabilities)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
