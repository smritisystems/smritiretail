services:
  db:
    image: postgres:15-alpine
    container_name: smriti-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smritisys}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - smriti_db_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smritisys"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  smriti-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smriti-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smritisys}"
      DATABASE_PROVIDER: "postgres"
      SYNC_PROVIDER: "postgres"
      CACHE_PROVIDER: "memory"
      STORAGE_PROVIDER: "filesystem"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      PYTHON_CORE_HOST: "smriti-api:8000"
    volumes:
      - ./.git:/usr/src/app/.git
      - ./dist:/usr/src/app/dist
      - ./public:/usr/src/app/public
    depends_on:
      db:
        condition: service_healthy
      smriti-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  smriti-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smriti-api
    restart: unless-stopped
    ports:
      - "${BACKEND_API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smritisys}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env — see .env.example}"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env — see .env.example}"
      SGIP_VAULT_MASTER_KEY: "${SGIP_VAULT_MASTER_KEY:?Set SGIP_VAULT_MASTER_KEY in .env — see .env.example}"
      # When true, the container will skip running Alembic migrations on startup.
      # Recommended long-term: run migrations as a one-off job from CI or an init container.
      SKIP_MIGRATIONS: "${SKIP_MIGRATIONS:-true}"
    volumes:
      - ./backend/app:/app/app
      - ./CHANGELOG.md:/app/CHANGELOG.md
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smriti-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-netmanthan@123}"
      MSSQL_PID: "Developer"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - smriti_mssql_volume:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-netmanthan@123}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-netmanthan@123}\" -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  smriti_db_volume:
    name: smriti_db_volume
  smriti_mssql_volume:
    name: smriti_mssql_volume

